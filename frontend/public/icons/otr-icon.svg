<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open-Terminal-Remote 应用 icon

  设计语义：
   - 圆角方底（深色磨砂质感）= 设备
   - 中央 ">_" prompt = 终端身份
   - 右上信号弧 = 远程 / 局域网传输
   - 主色 #b6f09c（项目 accent 磷光绿）+ 轻微 glow

  尺寸：512×512（向量，可任意缩放）
  Maskable safe area：内容控制在中心 80%（≈ 410×410）
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 背景径向渐变：中心稍亮，模拟磷光感 -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1a2218"/>
      <stop offset="65%" stop-color="#0e120e"/>
      <stop offset="100%" stop-color="#080a08"/>
    </radialGradient>

    <!-- 主元素的磷光辉 -->
    <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 边缘细描线渐变（让方块有立体感） -->
    <linearGradient id="edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(182,240,156,0.20)"/>
      <stop offset="100%" stop-color="rgba(182,240,156,0)"/>
    </linearGradient>
  </defs>

  <!-- 圆角方底（覆盖整个画布；maskable safe area 让 PWA 圆 mask 落在边缘） -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGlow)"/>
  <!-- 顶部高光细描线 -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="none"
        stroke="url(#edge)" stroke-width="2"/>

  <!-- 主体：居中略偏左的 ">" + "_" 提示符 -->
  <g filter="url(#phosphor)" stroke="#b6f09c" fill="none"
     stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- 大于号（居中略偏左） -->
    <polyline points="172,196 256,256 172,316"/>
    <!-- 下划线（光标位） -->
    <line x1="276" y1="328" x2="356" y2="328"/>
  </g>

  <!-- 右上：远程信号三段弧 -->
  <g filter="url(#phosphor)" stroke="#b6f09c" fill="none"
     stroke-width="14" stroke-linecap="round">
    <!-- 中弧 -->
    <path d="M 376 156 a 38 38 0 0 1 53 0" opacity="0.85"/>
    <!-- 大弧 -->
    <path d="M 360 130 a 65 65 0 0 1 86 0" opacity="0.55"/>
    <!-- 信号源点 -->
    <circle cx="402" cy="178" r="6" fill="#b6f09c" stroke="none"/>
  </g>
</svg>
