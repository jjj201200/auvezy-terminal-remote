<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-visual（Chromium 108+ / Firefox 132+，含 iOS Chrome）：
      键盘弹起时只压缩 visual viewport，layout viewport 保持原尺寸 → ResizeObserver
      不会因键盘触发 → xterm 的 cols/rows 不抖 → PTY 收不到错位 SIGWINCH
      → zsh-autosuggestions 之类的"原地刷新"序列正常工作。
      iOS Safari 仍未支持，靠 useViewportFix + visualViewport 检测兜底。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
    <!-- 与 manifest theme_color 一致：浏览器 / PWA 顶栏背景色 -->
    <meta name="theme-color" content="#0e120e" />

    <!-- PWA manifest：Android Chrome 看到 install 提示，桌面 Chrome 弹"安装应用" -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS Safari "添加到主屏幕"配套：
         - apple-mobile-web-app-capable=yes：启动后不带 Safari UI（全屏）
         - status-bar-style=black-translucent：状态栏透明，让顶部 safe area 由我们控制
         - apple-touch-icon：iOS 主屏图标（17+ 支持 SVG，旧版本会自动降级生成截图） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ATR" />
    <link rel="apple-touch-icon" href="/icons/atr-icon-180.png" />

    <!-- 浏览器标签页 / 桌面快捷方式 favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/atr-icon.svg" />
    <title>Auvezy Terminal Remote</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
